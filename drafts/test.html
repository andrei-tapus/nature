<div id="box" style="width: 50px; height: 50px; background: red; position: relative;"></div>

<script>
  const box = document.getElementById('box');
  let position = 0;

  function animate() {
    box.style.left = position + 'px';
    if (position < 300) {
        position += 2;
        requestAnimationFrame(animate);
    } else if (position >= 300) {
        position -= 2;
        requestAnimationFrame(animate);
    }
  }

  requestAnimationFrame(animate);
</script>
