<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Berkeley Species Map</title>
    
    <!-- 1. Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
        crossorigin="" 
    />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        /* UI Panel for species toggle buttons */
        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 280px;
        }
        #controls h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #222;
        }
        #controls p {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #666;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 8px;
            border: 2px solid #ccc;
            background-color: #ffffff;
            color: #333;
            font-weight: 600;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn:hover {
            border-color: #888;
            background-color: #f8f9fa;
        }
        .btn.active {
            border-color: #111;
            background-color: #222;
            color: #fff;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        .btn-label {
            display: flex;
            align-items: center;
            text-align: left;
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .count-badge {
            background: rgba(0, 0, 0, 0.08);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 6px;
        }
        .btn.active .count-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
        .popup-img {
            width: 100%;
            max-height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 6px;
        }
        #loading {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h4>Top 5 Campus Species</h4>
        <p>Click to toggle individual observations</p>
        <div id="loading">Loading CSV data...</div>
        <div id="button-container"></div>
    </div>

    <div id="map"></div>

    <!-- 2. Leaflet JavaScript -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin="">
    </script>

    <!-- 3. PapaParse for Dynamic CSV Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        // 4. Initialize Leaflet Map centered on UC Berkeley campus
        const map = L.map('map').setView([37.8712, -122.2640], 17);

        // 5. Add Stadia Maps - Stamen Watercolor Layer
        L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg?api_key=YOUR-API-KEY', {
            maxZoom: 18,
            opacity: .5,
            attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
        }).addTo(map);

        // Vibrant colors assigned to the top 5 species markers
        const speciesColors = ['#d95f02', '#7570b3', '#e7298a', '#2b83ba', '#abdda4'];

        // Layer storage for toggling markers on/off
        const speciesLayers = {};

        // 6. Dynamically Fetch and Parse small_data.csv
        Papa.parse('data/big_data.csv', {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                processCSVData(results.data);
            },
            error: function(err) {
                document.getElementById('loading').innerText = 'Error loading CSV file.';
                console.error(err);
            }
        });

        function processCSVData(data) {
            // Count total instances per species (using common_name)
            const speciesCounts = {};
            const speciesRecords = {};

            data.forEach(row => {
                const name = row.common_name || row.scientific_name;
                const lat = parseFloat(row.latitude);
                const lng = parseFloat(row.longitude);

                if (name && !isNaN(lat) && !isNaN(lng)) {
                    if (!speciesCounts[name]) {
                        speciesCounts[name] = 0;
                        speciesRecords[name] = [];
                    }
                    speciesCounts[name]++;
                    speciesRecords[name].push(row);
                }
            });

            // Get top 5 species sorted by total observations
            const top5Species = Object.keys(speciesCounts)
                .sort((a, b) => speciesCounts[b] - speciesCounts[a])
                .slice(0, 30);

            const buttonContainer = document.getElementById('button-container');

            // Build markers and toggle buttons for each of the top 5 species
            top5Species.forEach((speciesName, index) => {
                const records = speciesRecords[speciesName];
                const color = speciesColors[index % speciesColors.length];
                const layerGroup = L.layerGroup();

                // Plot every single observation as a circle marker
                records.forEach(row => {
                    const marker = L.circleMarker([row.latitude, row.longitude], {
                        radius: 5,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 1
                    });

                    // Build popup content with observation details
                    let popupContent = `<b>${row.common_name || 'Unknown'}</b><br>`;
                    if (row.scientific_name) popupContent += `<i>${row.scientific_name}</i><br>`;
                    if (row.place_guess) popupContent += `<small>${row.place_guess}</small><br>`;
                    if (row.image_url) {
                        popupContent += `<img src="${row.image_url}" class="popup-img" alt="Observation Image" />`;
                    }

                    marker.bindPopup(popupContent);
                    layerGroup.addLayer(marker);
                });

                speciesLayers[speciesName] = layerGroup;

                // Create UI toggle button
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `
                    <span class="btn-label">
                        <span class="color-dot" style="background-color: ${color}"></span>
                        ${speciesName}
                    </span>
                    <span class="count-badge">${records.length}</span>
                `;

                btn.onclick = () => {
                    if (map.hasLayer(layerGroup)) {
                        map.removeLayer(layerGroup);
                        btn.classList.remove('active');
                    } else {
                        map.addLayer(layerGroup);
                        btn.classList.add('active');
                    }
                };

                buttonContainer.appendChild(btn);
            });
        }
    </script>
</body>
</html>
